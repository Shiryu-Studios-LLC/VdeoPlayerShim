variables:
  PACKAGE_NAME: ArchiTech.VideoPlayerShim
  RELEASE_DESCRIPTION: |
    ### Install from the repo listing at https://vpm.techanon.dev 
    

stages:
  - deploy
  - release

prepare-asset:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    PROJECT_API_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
    PROJECT_URL: "${CI_SERVER_URL}/${CI_PROJECT_PATH}"
    RELEASE_URL: "${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/releases/${CI_COMMIT_TAG}/downloads/package"
    FILE_NAME: "${PACKAGE_NAME}_${CI_COMMIT_TAG}"
    PACKAGE_URL: "${PROJECT_API_URL}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/${FILE_NAME}.zip"
  before_script:
    - apk add --update zip curl jq sudo
  script:
    - echo "Preparing asset..."
    # by default add all non-hidden files (the . notation) to distribution zip
    - find -name ".?*" -prune -o -print | zip -@ ./${FILE_NAME}.zip
    # modify the above to handle whatever files you need for your own project
    - wc -c < "${FILE_NAME}.zip"
    - echo "Uploading asset to ${PACKAGE_URL}"
    - |
      curl -# --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "${FILE_NAME}.zip" ${PACKAGE_URL}?status=default

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    PROJECT_API_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
    PROJECT_URL: "${CI_SERVER_URL}/${CI_PROJECT_PATH}"
    RELEASE_URL: "${CI_SERVER_URL}/${CI_PROJECT_PATH}/-/releases/${CI_COMMIT_TAG}/downloads/package"
    FILE_NAME: "${PACKAGE_NAME}_${CI_COMMIT_TAG}"
    PACKAGE_URL: "${PROJECT_API_URL}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/${FILE_NAME}.zip"
  script:
    - echo "Running release for $CI_COMMIT_TAG"
  release:
    name: "Release for ${CI_COMMIT_TAG}"
    description: "${RELEASE_DESCRIPTION}"
    tag_name: "${CI_COMMIT_TAG}"
    assets:
      links:
        - name: "${FILE_NAME}.zip"
          url: "${PACKAGE_URL}"
          filepath: '/package/${FILE_NAME}.zip'
          link_type: package
